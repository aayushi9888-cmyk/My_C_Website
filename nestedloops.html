<h1>Questions </h1>
<h2>1.Write a program print the pattern on the screen
11111
11111
11111</h2>
<h3> Source Code</h3>
<pre>#include &lt;stdio.h&gt;
void main()
{
int i, j;
for(i = 1; i <= 3; i++)
{
for(j = 1; j <= 5; j++)
{
printf("1");
}
printf("\n");
}
}
</pre>
<h3>Output</h3>
<pre>11111
11111
1111
</pre>
